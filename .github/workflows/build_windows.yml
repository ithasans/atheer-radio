name: Build Obfuscated Windows Release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.2'
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build Obfuscated Windows App (.exe)
        run: flutter build windows --release --obfuscate --split-debug-info=build/symbols

      - name: Compress Windows Release Bundle
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath AtheerRadio_Windows_x64.zip

      - name: Upload Windows Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: atheer-radio-windows-x64
          path: AtheerRadio_Windows_x64.zip
