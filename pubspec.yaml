name: myradio1
description: أثير العالم - تطبيق راديو الإنترنت الاحترافي.
publish_to: 'none' 

version: 1.2.0+3

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.5.1
  
  # Audio Playback
  just_audio: ^0.10.5
  audio_service: ^0.18.12
  
  # Other useful packages
  rxdart: ^0.28.0

  # to connect to the internet
  http: ^1.1.0

  shared_preferences: ^2.2.2

  path_provider: ^2.1.2


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mockito: ^5.4.4
  build_runner: ^2.4.6

flutter:
  uses-material-design: true
